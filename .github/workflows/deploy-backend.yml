name: Deploy backend to Cloud Run (production)

# Production only: merges/pushes to main. Staging uses deploy-backend-staging.yml on develop.
# Secrets come from the GitHub Environment "production" (or repo secrets of the same name).
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: kitchmate-495620
  REGION: asia-south1
  SERVICE: kitchenai-backend
  # Mumbai Artifact Registry (not legacy gcr.io/us)
  IMAGE: asia-south1-docker.pkg.dev/kitchmate-495620/kitchenai/backend

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/208103249970/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: github-deployer@kitchmate-495620.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Build container image
        working-directory: backend
        run: |
          IMAGE_SHA="${IMAGE}:${GITHUB_SHA}"
          echo "IMAGE_SHA=${IMAGE_SHA}" >> "$GITHUB_ENV"
          docker build -t "${IMAGE}:latest" -t "${IMAGE_SHA}" .

      - name: Push image
        run: |
          docker push "${IMAGE}:latest"
          docker push "${IMAGE_SHA}"

      - name: Deploy to Cloud Run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_VISION_API_KEY: ${{ secrets.GOOGLE_VISION_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SESSION_TOKEN_SECRET: ${{ secrets.SESSION_TOKEN_SECRET }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          KAFKA_PASSWORD: ${{ secrets.KAFKA_PASSWORD }}
          KAFKA_CA_PEM: ${{ secrets.KAFKA_CA_PEM }}
          RAZORPAY_KEY_ID_PRODUCTION: ${{ secrets.RAZORPAY_KEY_ID_PRODUCTION }}
          RAZORPAY_KEY_SECRET_PRODUCTION: ${{ secrets.RAZORPAY_KEY_SECRET_PRODUCTION }}
          RAZORPAY_WEBHOOK_SECRET_PRODUCTION: ${{ secrets.RAZORPAY_WEBHOOK_SECRET_PRODUCTION }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          python3 <<'PY'
          import os
          import sys

          def yaml_value(s: str) -> str:
              s = s.replace("\r\n", "\n").replace("\r", "\n")
              if "\n" in s:
                  lines = s.split("\n")
                  return "|\n" + "\n".join(f"  {line}" for line in lines)
              escaped = s.replace("\\", "\\\\").replace('"', '\\"')
              return f'"{escaped}"'

          required = [
              "DATABASE_URL",
              "GEMINI_API_KEY",
              "GOOGLE_VISION_API_KEY",
              "GROQ_API_KEY",
              "SESSION_TOKEN_SECRET",
              "REDIS_URL",
              "KAFKA_PASSWORD",
              "KAFKA_CA_PEM",
              "RAZORPAY_KEY_ID_PRODUCTION",
              "RAZORPAY_KEY_SECRET_PRODUCTION",
              "RAZORPAY_WEBHOOK_SECRET_PRODUCTION",
              "SMTP_PASS",
          ]
          missing = [k for k in required if not os.environ.get(k)]
          if missing:
              print("Missing GitHub Environment secrets:", ", ".join(missing), file=sys.stderr)
              print(
                  "Upload with: cd backend && KAFKA_CA_PEM_FILE=/path/to/ca.pem "
                  "./scripts/upload_secrets_github.sh production",
                  file=sys.stderr,
              )
              sys.exit(1)

          static = {
              "ENVIRONMENT": "production",
              "GEMINI_MODEL": "gemini-2.5-flash-lite",
              "LLM_PROVIDER": "groq",
              "GROQ_MODEL": "qwen/qwen3.6-27b",
              "GROQ_NLU_MODEL": "qwen/qwen3.6-27b",
              "RAZORPAY_ENV": "production",
              "SMTP_HOST": "smtp.gmail.com",
              "SMTP_PORT": "587",
              "SMTP_USER": "kitchmateai@gmail.com",
              "SMTP_FROM": "Rasoibuddy <kitchmateai@gmail.com>",
              "WHATSAPP_TEST_MODE": "true",
              "GOOGLE_WEB_CLIENT_ID": "208103249970-qg4bv6ilknfe52eqks8u662hp3toneua.apps.googleusercontent.com",
              "GOOGLE_IOS_CLIENT_ID": "208103249970-5j9v2282v0f9r0d8859shqmnurpc93lp.apps.googleusercontent.com",
              "GOOGLE_ANDROID_CLIENT_ID": "208103249970-ssbd98i8gqndd1o10vbaa6e5nfhkfcft.apps.googleusercontent.com",
              "KAFKA_ENABLED": "true",
              "KAFKA_BROKERS": "kafka-2ee49b67-bhavyajain464-358c.d.aivencloud.com:24210",
              "KAFKA_TOPIC_SHELFLIFE": "shelf-life-estimate",
              "KAFKA_SASL_ENABLED": "true",
              "KAFKA_SASL_MECHANISM": "PLAIN",
              "KAFKA_USERNAME": "avnadmin",
              "KAFKA_TLS_ENABLED": "true",
              "PREMIUM_GRANT_TIER": "elite",
              "PREMIUM_GRANT_EMAILS": "akhilshukla2000@gmail.com;avishabagdiya@gmail.com;bhavyajain464@gmail.com;houseofshringara25@gmail.com;infinitystones464@gmail.com;kitchmateai@gmail.com;prabalcs@gmail.com;prabaltikeriha@gmail.com;ritikjain3585@gmail.com;sankalpchauhan.me@gmail.com;singhjishan2@gmail.com;yash.singhania.smart@gmail.com;yashh.singhaniaa@gmail.com",
              "API_PUBLIC_URL": "https://kitchenai-backend-208103249970.asia-south1.run.app",
              "ZOMATO_MAX_ORDERS_PER_SYNC": "15",
              "COMMERCE_ENABLED": "false",
              "COMMERCE_ENABLED_PARTNERS": "blinkit,zepto",
              "COMMERCE_MAX_PARTNERS": "2",
          }

          with open("cloudrun-env.yaml", "w", encoding="utf-8") as f:
              for key, value in static.items():
                  f.write(f"{key}: {yaml_value(value)}\n")
              for key in required:
                  f.write(f"{key}: {yaml_value(os.environ[key])}\n")
          print("Wrote cloudrun-env.yaml")
          PY

          gcloud run deploy "${SERVICE}" \
            --image "${IMAGE_SHA}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --platform managed \
            --port 8080 \
            --memory 256Mi \
            --cpu 1 \
            --allow-unauthenticated \
            --clear-secrets \
            --env-vars-file cloudrun-env.yaml \
            --quiet

      - name: Show service URL
        run: |
          gcloud run services describe "${SERVICE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format='value(status.url)'
