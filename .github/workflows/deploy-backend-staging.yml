name: Deploy backend to Cloud Run (staging)

# Staging only: develop branch. Never deploys production Cloud Run.
# Secrets come from the GitHub Environment "staging" (or repo secrets of the same name).
on:
  push:
    branches: [develop]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend-staging.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-backend-staging
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: kitchmate-495620
  REGION: asia-south1
  SERVICE: kitchenai-backend-staging
  IMAGE: gcr.io/kitchmate-495620/kitchenai-backend-staging

jobs:
  deploy:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/208103249970/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: github-deployer@kitchmate-495620.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker auth for GCR
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Build container image
        working-directory: backend
        run: |
          IMAGE_SHA="${IMAGE}:${GITHUB_SHA}"
          echo "IMAGE_SHA=${IMAGE_SHA}" >> "$GITHUB_ENV"
          docker build -t "${IMAGE}:latest" -t "${IMAGE_SHA}" .

      - name: Push image
        run: |
          docker push "${IMAGE}:latest"
          docker push "${IMAGE_SHA}"

      - name: Deploy to Cloud Run (staging)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_VISION_API_KEY: ${{ secrets.GOOGLE_VISION_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SESSION_TOKEN_SECRET: ${{ secrets.SESSION_TOKEN_SECRET }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          KAFKA_PASSWORD: ${{ secrets.KAFKA_PASSWORD }}
          KAFKA_CA_PEM: ${{ secrets.KAFKA_CA_PEM }}
          RAZORPAY_KEY_ID_STAGING: ${{ secrets.RAZORPAY_KEY_ID_STAGING }}
          RAZORPAY_KEY_SECRET_STAGING: ${{ secrets.RAZORPAY_KEY_SECRET_STAGING }}
          RAZORPAY_WEBHOOK_SECRET_STAGING: ${{ secrets.RAZORPAY_WEBHOOK_SECRET_STAGING }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          python3 <<'PY'
          import os
          import sys

          def yaml_value(s: str) -> str:
              s = s.replace("\r\n", "\n").replace("\r", "\n")
              if "\n" in s:
                  lines = s.split("\n")
                  return "|\n" + "\n".join(f"  {line}" for line in lines)
              escaped = s.replace("\\", "\\\\").replace('"', '\\"')
              return f'"{escaped}"'

          required = [
              "DATABASE_URL",
              "GEMINI_API_KEY",
              "GOOGLE_VISION_API_KEY",
              "GROQ_API_KEY",
              "SESSION_TOKEN_SECRET",
              "REDIS_URL",
              "KAFKA_PASSWORD",
              "KAFKA_CA_PEM",
              "RAZORPAY_KEY_ID_STAGING",
              "RAZORPAY_KEY_SECRET_STAGING",
              "RAZORPAY_WEBHOOK_SECRET_STAGING",
              "SMTP_PASS",
          ]
          missing = [k for k in required if not os.environ.get(k)]
          if missing:
              print("Missing GitHub secrets:", ", ".join(missing), file=sys.stderr)
              sys.exit(1)

          static = {
              "ENVIRONMENT": "staging",
              "GEMINI_MODEL": "gemini-2.5-flash-lite",
              "LLM_PROVIDER": "groq",
              "GROQ_MODEL": "qwen/qwen3.6-27b",
              "GROQ_NLU_MODEL": "qwen/qwen3.6-27b",
              "RAZORPAY_ENV": "staging",
              "SMTP_HOST": "smtp.gmail.com",
              "SMTP_PORT": "587",
              "SMTP_USER": "kitchmateai@gmail.com",
              "SMTP_FROM": "Rasoibuddy <kitchmateai@gmail.com>",
              "WHATSAPP_TEST_MODE": "true",
              "GOOGLE_WEB_CLIENT_ID": "208103249970-qg4bv6ilknfe52eqks8u662hp3toneua.apps.googleusercontent.com",
              "GOOGLE_IOS_CLIENT_ID": "208103249970-5j9v2282v0f9r0d8859shqmnurpc93lp.apps.googleusercontent.com",
              "GOOGLE_ANDROID_CLIENT_ID": "208103249970-ssbd98i8gqndd1o10vbaa6e5nfhkfcft.apps.googleusercontent.com",
              "KAFKA_ENABLED": "true",
              "KAFKA_BROKERS": "kafka-2ee49b67-bhavyajain464-358c.d.aivencloud.com:24210",
              "KAFKA_TOPIC_SHELFLIFE": "shelf-life-estimate",
              "KAFKA_SASL_ENABLED": "true",
              "KAFKA_SASL_MECHANISM": "PLAIN",
              "KAFKA_USERNAME": "avnadmin",
              "KAFKA_TLS_ENABLED": "true",
              "API_PUBLIC_URL": "https://kitchenai-backend-staging-208103249970.asia-south1.run.app",
              "ZOMATO_MAX_ORDERS_PER_SYNC": "15",
              "COMMERCE_ENABLED": "false",
              "COMMERCE_ENABLED_PARTNERS": "blinkit,zepto,instamart",
              "COMMERCE_MAX_PARTNERS": "3",
          }

          with open("cloudrun-env.yaml", "w", encoding="utf-8") as f:
              for key, value in static.items():
                  f.write(f"{key}: {yaml_value(value)}\n")
              for key in required:
                  f.write(f"{key}: {yaml_value(os.environ[key])}\n")
          print("Wrote cloudrun-env.yaml")
          PY

          gcloud run deploy "${SERVICE}" \
            --image "${IMAGE_SHA}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --platform managed \
            --port 8080 \
            --memory 256Mi \
            --cpu 1 \
            --allow-unauthenticated \
            --clear-secrets \
            --env-vars-file cloudrun-env.yaml \
            --quiet

      - name: Show service URL
        run: |
          gcloud run services describe "${SERVICE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format='value(status.url)'
